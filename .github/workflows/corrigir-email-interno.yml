name: Corrigir dominio interno dos usuarios

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-email-interno.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Corrigir dominio interno
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text(encoding='utf-8')
          antigo = "const dominioInterno='usuarios.local';"
          novo = "const dominioInterno='usuarios.example.com';"
          if antigo not in s:
              raise SystemExit('Dominio antigo nao encontrado')
          p.write_text(s.replace(antigo, novo, 1), encoding='utf-8')
          PY
      - name: Salvar correcao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "Corrige email interno dos colaboradores"
          git push
